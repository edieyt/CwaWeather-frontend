<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>滴氣象</title>
    <link rel="icon" type="image/png" href="./icon-v2.png"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* 吉伊卡哇風格色票 */
            --ck-pink: #FFD9E8;       /* 吉伊卡哇粉 */
            --ck-white: #FFFEFA;      /* 溫暖的白 */
            --ck-blue: #89CFF0;       /* 小八貓藍 */
            --ck-yellow: #FFF8AB;     /* 烏薩奇黃 */
            --ck-brown: #6D5648;      /* 巧克力描邊色 (取代黑色) */
            --ck-shadow: rgba(109, 86, 72, 0.15);
            --ck-accent-pink: #FF9EBC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--ck-pink);
            /* 背景改為可愛的白色波點 */
            background-image: radial-gradient(var(--ck-white) 20%, transparent 20%),
                              radial-gradient(var(--ck-white) 20%, transparent 20%);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            min-height: 100vh;
            color: var(--ck-brown);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* 頂部狀態列：更像漂浮的雲朵 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .location-pill {
            background: var(--ck-white);
            color: var(--ck-brown);
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.2rem;
            transform: rotate(-3deg); /* 俏皮的歪斜 */
            border: 3px solid var(--ck-brown);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
        }

        .update-pill {
            font-size: 0.85rem;
            color: var(--ck-brown);
            background: var(--ck-white);
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid var(--ck-brown);
            font-weight: 700;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* === 核心：今日焦點卡片 (大臉貼紙風格) === */
        .hero-card {
            background: var(--ck-white);
            border-radius: 40px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 25px var(--ck-shadow);
            border: 4px solid var(--ck-brown);
            margin-bottom: 25px;
            position: relative;
            /* 讓卡片有點軟軟的感覺 */
            border-bottom-width: 8px; 
        }

        /* 對話框改為黃色 (烏薩奇風格) */
        .hero-period {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) rotate(2deg);
            background: var(--ck-yellow);
            color: var(--ck-brown);
            padding: 8px 25px;
            border-radius: 25px;
            font-weight: 900;
            border: 3px solid var(--ck-brown);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            font-size: 1.1rem;
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0 10px 0;
        }

        .hero-icon {
            font-size: 5.5rem;
            /* 給 Emoji 加白色描邊效果，像貼紙 */
            text-shadow: 
                2px 2px 0 #FFF, -2px -2px 0 #FFF,  
                2px -2px 0 #FFF, -2px 2px 0 #FFF;
            animation: wiggle 2s ease-in-out infinite;
        }

        /* 吉伊卡哇那種扭來扭去的動畫 */
        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .hero-temp {
            font-size: 5rem;
            font-weight: 900;
            color: var(--ck-brown);
            line-height: 1;
            font-family: 'Zen Maru Gothic', sans-serif;
            letter-spacing: -2px;
        }

        .hero-desc {
            font-size: 1.6rem;
            color: var(--ck-accent-pink);
            margin-bottom: 25px;
            font-weight: 900;
        }

        /* === 建議區 (加上手繪感分隔線) === */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            padding-top: 25px;
            /* 虛線改圓點線，比較可愛 */
            border-top: 4px dotted var(--ck-pink);
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 248, 171, 0.3); /* 淡黃色背景 */
            padding: 15px;
            border-radius: 25px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        /* 讓建議卡片看起來有點不同 */
        .advice-item:nth-child(2) {
             background: rgba(137, 207, 240, 0.2); /* 淡藍色背景 */
        }

        .advice-icon {
            font-size: 2.2rem;
            margin-bottom: 5px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .advice-text {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--ck-brown);
            margin: 5px 0;
            line-height: 1.2;
        }

        /* === 稍後預報 === */
        .section-title {
            font-size: 1.4rem;
            color: var(--ck-brown);
            margin-bottom: 15px;
            margin-left: 10px;
            font-weight: 900;
            /* 加上白色文字描邊 */
            text-shadow: 2px 2px 0 var(--ck-white);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 5px 25px 5px; /* 增加底部 padding 給陰影 */
            scrollbar-width: none;
        }

        .mini-card {
            min-width: 140px;
            background: var(--ck-white);
            border-radius: 30px;
            padding: 20px 15px;
            text-align: center;
            border: 3px solid var(--ck-brown);
            /* 讓陰影是實心的，像漫畫 */
            box-shadow: 5px 5px 0 var(--ck-accent-pink);
            flex-shrink: 0;
            transform: translateY(0);
            transition: transform 0.2s;
        }
        
        .mini-card:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0 var(--ck-accent-pink);
        }

        .mini-time {
            background: var(--ck-blue);
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: 900;
            border: 2px solid var(--ck-brown);
        }

        .mini-icon {
            font-size: 2.5rem;
            margin: 8px 0;
        }

        .mini-temp {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--ck-brown);
        }

        /* Loading 畫面：更可愛 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--ck-pink);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        
        .loading-text {
            color: var(--ck-brown);
            font-weight: 900;
            font-size: 1.2rem;
            margin-top: 20px;
            background: var(--ck-white);
            padding: 10px 20px;
            border-radius: 20px;
            border: 3px solid var(--ck-brown);
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 5rem; animation: bounce 0.5s infinite alternate;">☁️✨</div>
        <p class="loading-text">正在努力收集天氣...</p>
    </div>
    
    <div class="status-bar">
        <div class="location-pill">📍 桃園</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">

        <div id="heroCard">
            </div>

        <h3 class="section-title"><span>📌</span> 接下來的天氣</h3>
        <div class="scroll-container" id="futureForecasts">
            </div>

    </div>

    <script>
        const API_URL = "https://weather-tao-1d.zeabur.app/api/weather/kaohsiung";

        function getWeatherIcon(weather) {
            // 吉伊卡哇風格：稍微浮誇一點的 Emoji
            if (!weather) return "🌤️";
            if (weather.includes("晴")) return "☀️✨";
            if (weather.includes("多雲")) return "☁️";
            if (weather.includes("陰")) return "☁️💤";
            if (weather.includes("雨")) return "🌧️💦";
            if (weather.includes("雷")) return "⛈️⚡";
            return "🌤️";
        }

        function getAdvice(rainProb, maxTemp) {
            // === 文案大改版：吉伊卡哇語氣 ===
            
            let rainIcon = "🌂";
            let rainText = "放心出門啦"; // 原：不用帶傘
            if (parseInt(rainProb) > 30) {
                rainIcon = "☂️";
                rainText = "帶把傘好唷"; // 原：記得帶傘
            }

            let clothIcon = "👕";
            let clothText = "穿這樣剛好"; // 原：舒適穿搭
            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🍧"; // 改成冰品圖示更可愛
                clothText = "短袖涼爽爽"; // 原：短袖出發
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧣";
                clothText = "穿暖暖再出門"; // 原：加件外套
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨"; // 更親切
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "午後";
            if (hour >= 18 && hour < 23) return "晚間";
            return "深夜時刻"; // 深夜
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            // 1. 渲染 Hero Card (主畫面)
            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                        <div class="hero-card">
                            <div class="hero-period">${period}好 !</div>
                            <div class="hero-temp-container">
                                <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                                <div class="hero-temp">${avgTemp}°</div>
                            </div>
                            <div class="hero-desc">✨ ${current.weather} ✨</div>
                            
                            <div class="advice-grid">
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.rainIcon}</div>
                                    <div class="advice-text">${advice.rainText}</div>
                                    <div style="font-size:0.8rem; color:#A58E7E; font-weight:700">降雨機率 ${current.rain}</div>
                                </div>
                                <div class="advice-item">
                                    <div class="advice-icon">${advice.clothIcon}</div>
                                    <div class="advice-text">${advice.clothText}</div>
                                    <div style="font-size:0.8rem; color:#A58E7E; font-weight:700">最高溫 ${current.maxTemp}°</div>
                                </div>
                            </div>
                        </div>
                    `;

            // 2. 渲染稍後預報
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);
                const fDate = new Date(f.startTime);
                
                // 明天的顯示方式更可愛一點
                if (fDate.getDate() !== todayDate) {
                    p = "明天" + p;
                }

                scrollContainer.innerHTML += `
                            <div class="mini-card">
                                <div class="mini-time">${p}</div>
                                <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                                <div class="mini-temp">${f.minTemp}° ~ ${f.maxTemp}°</div>
                                <div style="font-size:0.85rem; color:#A58E7E; margin-top:5px; font-weight:bold;">
                                    💧 ${f.rain}
                                </div>
                            </div>
                        `;
            });

            // 3. 右上角日期顯示
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            document.getElementById('updateTime').textContent = `${month}/${date} ${days[dayIndex]} 更新`;
        }

        async function fetchWeather() {
            try {
                // 為了讓使用者看到可愛的 Loading，保留延遲
                const delayPromise = new Promise(resolve => setTimeout(resolve, 1200));
                const fetchPromise = fetch(API_URL).then(res => res.json());

                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                console.error(e);
                // 失敗時的文案也要可愛
                alert("嗚...天氣資料抓取失敗，可能是被除草拔掉了 🌱");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>

</html>
